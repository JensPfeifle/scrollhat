[project]
name = "scrollhat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "basedpyright>=1.39.10",
    "gpiozero>=2.0.1.post3",
    # Pi-only: lgpio needs linux/gpio.h, so it cannot build on a dev machine.
    "lgpio>=0.2.2.0 ; sys_platform == 'linux'",
    "paho-mqtt>=2.1.0",
    "scrollphathd",
    "six>=1.17.0",
]

[project.scripts]
scrollhat = "scrollhat:main"
scrollhat-sim = "scrollhat.simulator.__main__:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
scrollphathd = { git = "https://github.com/JensPfeifle/scroll-phat-hd.git", subdirectory = "library" }

[dependency-groups]
dev = [
    "python-lsp-server>=1.15.0",
    "ruff>=0.16.5",
]
